<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#3f6fd8">
  <title>Patrouille Nounours</title>
  <style>
:root {
  --ink: #1d2f45;
  --cream: #fff8e8;
  --sun: #ffd34d;
  --blue: #3f6fd8;
  --navy: #22427a;
  --green: #4cc552;
  --red: #ff4d4d;
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #8fd3ff; color: var(--ink); }
body { user-select: none; -webkit-user-select: none; }
body.officer { touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
body.station #scene { display: none; }

.card { background: var(--cream); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 rgba(29,47,69,0.4); }
.overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 14px; background: rgba(34,66,122,0.55); overflow: auto; }
.round { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); box-shadow: 0 4px 0 rgba(29,47,69,0.35); padding: 0; font-size: 20px; flex: none; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,47,69,0.35); }
.round svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.round .cross { display: none; }
.round.muted .wave { display: none; }
.round.muted .cross { display: inline; }
.round.lang b { font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px; background: var(--cream); border: 3px solid var(--ink); border-radius: 21px; box-shadow: 0 4px 0 rgba(29,47,69,0.3); font-size: 18px; white-space: nowrap; }
.pill.small { height: 34px; font-size: 13px; padding: 0 12px; }
.small-button { padding: 8px 16px; border-radius: 16px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 rgba(29,47,69,0.3); font-weight: bold; font-size: 15px; }
.small-button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,47,69,0.3); }
.small-button:disabled { opacity: 0.55; cursor: default; }
.small-button.done { background: #d3f9d8; opacity: 1; }
.small-button.glow:not(:disabled) { background: #fff3bf; animation: glow 1.6s ease-in-out infinite; }
.small-button.bravo { background: #ffe0ec; }
@keyframes glow { 50% { box-shadow: 0 4px 0 rgba(29,47,69,0.3), 0 0 0 6px rgba(255,211,77,0.6); } }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(0.7); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
.shake { animation: shake 0.4s ease; }

/* ===== Title ===== */
.title-card { width: min(640px, 100%); padding: 16px 22px 20px; text-align: center; }
.title-card canvas#titleArt { width: 100%; height: auto; display: block; border-radius: 18px; border: 3px solid var(--ink); }
.title-card h1 { font: bold clamp(32px, 6vw, 50px) Georgia, serif; margin: 12px 0 2px; color: var(--navy); text-shadow: 0 3px 0 #cfe0ff; }
.title-card > p { margin: 0 0 14px; font-size: 17px; }
.roles { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.role { flex: 1 1 220px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 12px 14px; border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 rgba(29,47,69,0.4); }
.role:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(29,47,69,0.4); }
.role canvas { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); }
.role b { font-size: 22px; }
.role small { font-size: 13px; opacity: 0.8; }
.officer-role { background: #d7e8ff; }
.station-role { background: #ffe3c4; }
.title-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.check input { width: 20px; height: 20px; }

/* ===== Join keypad ===== */
.join-card { padding: 18px 22px; text-align: center; width: min(420px, 100%); }
.join-card h2 { margin: 0 0 12px; font: bold 26px Georgia, serif; color: var(--navy); }
.code-slots { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
.code-slots span { width: 60px; height: 72px; display: grid; place-items: center; border: 4px solid var(--ink); border-radius: 14px; background: #fff; font: bold 40px Georgia, serif; }
.code-slots span.filled { background: #fff3bf; animation: pop 0.2s ease; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.key { height: 64px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; box-shadow: 0 4px 0 rgba(29,47,69,0.3); font: bold 30px "Trebuchet MS", sans-serif; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,47,69,0.3); }
.key.erase { background: #ffe3e3; }
.tap-start { border: 0; font-size: 80px; }
.tap-start span { padding: 30px 60px; background: var(--cream); border: 5px solid var(--ink); border-radius: 40px; box-shadow: 0 8px 0 rgba(29,47,69,0.4); animation: glow 1.4s infinite; }

/* ===== Officer HUD ===== */
.hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 12px 0; pointer-events: none; z-index: 5; }
.hud-top > * { pointer-events: auto; }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.mission-card { width: 92px; height: 92px; border: 4px solid var(--ink); border-radius: 22px; background: #fff; box-shadow: 0 5px 0 rgba(29,47,69,0.35); display: grid; place-items: center; animation: pop 0.35s ease; }
.mission-card canvas { width: 80px; height: 80px; }
.gps-bubble { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 22px 6px 6px; background: var(--cream); border: 4px solid var(--ink); border-radius: 50px; box-shadow: 0 6px 0 rgba(29,47,69,0.35); z-index: 6; }
.gps-bubble.pop { animation: pop 0.3s ease; }
.gps-bubble canvas { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); }
.gps-bubble span { font-size: 58px; line-height: 1; color: var(--blue); }

.drive-controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; z-index: 5; }
.drive-controls > * { pointer-events: auto; }
.side-buttons { display: flex; flex-direction: column; gap: 10px; }
.arrows { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 14px; align-items: flex-end; }
.arrow { width: 96px; height: 96px; border-radius: 28px; border: 5px solid var(--ink); background: #fff; box-shadow: 0 6px 0 rgba(29,47,69,0.4); display: grid; place-items: center; padding: 0; transition: opacity 0.2s; }
.arrow#btnStraight { margin-bottom: 26px; }
.arrow svg, .drive-btn svg { width: 60px; height: 60px; fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.arrow:active, .drive-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(29,47,69,0.4); }
.arrow.off { opacity: 0.25; }
.arrow.queued { background: #b2f2bb; }
.arrow.pulse { animation: pulseArrow 1s ease-in-out infinite; }
.arrow.gps, .drive-btn.gps { box-shadow: 0 6px 0 rgba(29,47,69,0.4), 0 0 0 8px rgba(63,140,255,0.6); }
@keyframes pulseArrow { 50% { transform: scale(1.08); background: #fff3bf; } }
.drive-btn { width: 78px; height: 78px; border-radius: 50%; border: 4px solid var(--ink); background: #fff; box-shadow: 0 5px 0 rgba(29,47,69,0.4); font-size: 36px; display: grid; place-items: center; padding: 0; }
.drive-btn.back { width: 64px; height: 64px; }
.drive-btn.back svg { width: 40px; height: 40px; }
.siren { width: 96px; height: 96px; background: #e9ecf5; }
.siren .lights { display: flex; gap: 4px; }
.siren .lights i { width: 30px; height: 34px; border: 3px solid var(--ink); border-radius: 12px 12px 4px 4px; background: #e88; }
.siren .lights i + i { background: #8ab4f8; }
.siren.on { background: #fff3bf; }
.siren.on .lights i { animation: flashRed 0.35s steps(1) infinite; }
.siren.on .lights i + i { animation: flashBlue 0.35s steps(1) infinite; }
@keyframes flashRed { 50% { background: #ff2d2d; box-shadow: 0 0 18px #ff2d2d; } }
@keyframes flashBlue { 0% { background: #1f6bff; box-shadow: 0 0 18px #1f6bff; } 50% { background: #8ab4f8; box-shadow: none; } }

.dialogue { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); width: min(680px, calc(100% - 250px)); display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 rgba(29,47,69,0.35); z-index: 6; pointer-events: none; }
.dialogue.pop { animation: fadeDown 0.25s ease; }
@keyframes fadeDown { from { transform: translate(-50%, -20px); opacity: 0; } }
.dialogue canvas { width: 64px; height: 64px; flex: none; background: radial-gradient(circle at 50% 70%, #fff2c2, #ffd98a); border: 3px solid var(--ink); border-radius: 50%; }
.dialogue strong { display: block; font-size: 13px; color: var(--blue); margin-bottom: 1px; }
.dialogue p { margin: 0; font-size: clamp(14px, 2vw, 19px); line-height: 1.25; }
.conn-overlay { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(34,66,122,0.45); }
.conn-overlay .card { padding: 18px 26px; text-align: center; font-size: 20px; }
.spinner { width: 46px; height: 46px; margin: 0 auto 10px; border: 6px solid #cfe0ff; border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rotate-hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; padding: 10px 18px; background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; font-size: 16px; }

/* ===== Station ===== */
.station { position: fixed; inset: 0; display: flex; flex-direction: column; background: #dfe9fb; }
.st-head { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--navy); color: #fff; flex-wrap: wrap; }
.st-head .pill, .st-head .round { color: var(--ink); }
.st-title { display: flex; align-items: center; gap: 10px; font: bold 22px Georgia, serif; }
.st-title canvas { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); }
.st-tools { display: flex; gap: 8px; margin-left: auto; }
.status.connected { background: #d3f9d8; }
.status.lost, .status.offline, .status.error, .status.no-host { background: #ffe3e3; }
.vehicle-note { font-size: 15px; opacity: 0.9; }
.st-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; padding: 12px; }
.st-left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.todo { padding: 10px 16px; background: #fff3bf; border: 3px solid var(--ink); border-radius: 16px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 0 rgba(29,47,69,0.25); }
.st-view { position: relative; flex: 1; min-height: 240px; border: 4px solid var(--ink); border-radius: 20px; overflow: hidden; background: #9ed27a; }
.st-view > canvas { position: absolute; inset: 0; display: block; }
.st-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 58px; }
.pad { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; }
.pad-title { font-weight: bold; font-size: 14px; margin-right: 4px; }
.pad-btn { width: 54px; height: 46px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 rgba(29,47,69,0.3); font-size: 24px; padding: 0; }
.pad-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(29,47,69,0.3); }
.next-turn { padding: 8px 14px; background: #d0ebff; border: 3px solid var(--ink); border-radius: 14px; font-weight: bold; font-size: 17px; }
.radio-flash { position: absolute; top: 12px; right: 12px; padding: 10px 16px; background: #fff3bf; border: 3px solid var(--ink); border-radius: 16px; font-weight: bold; font-size: 18px; animation: pop 0.3s ease, glow 1s infinite; }
.st-side { overflow: auto; background: var(--cream); border: 4px solid var(--ink); border-radius: 20px; padding: 4px 14px 14px; }
.st-side h3 { margin: 12px 0 6px; font: bold 19px Georgia, serif; color: var(--navy); }
.clues { display: grid; gap: 6px; }
.clue { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border: 2px dashed rgba(29,47,69,0.35); border-radius: 14px; background: #fff; }
.clue.known { border-style: solid; border-color: var(--ink); background: #f3fff2; }
.clue canvas { width: 44px; height: 44px; flex: none; }
.clue-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.clue-body small { font-size: 12px; opacity: 0.75; }
.clue-body b { font-size: 16px; letter-spacing: 0.04em; }
.clue-body .small-button { margin-top: 4px; align-self: flex-start; font-size: 13px; padding: 5px 10px; }
.witnesses { display: grid; gap: 8px; }
.witness { padding: 8px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; }
.witness-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.witness-head canvas { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); }
.questions { display: flex; flex-wrap: wrap; gap: 6px; }
.questions .small-button { font-size: 13px; padding: 5px 10px; }
.answer { margin: 6px 0 0; font-size: 14px; font-style: italic; }
.note { margin: 6px 0 0; font-size: 13px; opacity: 0.75; }
.suspects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.suspect { position: relative; display: flex; flex-direction: column; align-items: center; padding: 4px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; font-size: 13px; }
.suspect canvas { width: 82px; height: 112px; }
.suspect.crossed canvas { opacity: 0.35; }
.suspect.crossed::after { content: '✕'; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 64px; color: var(--red); font-weight: bold; }
.suspect.answer { background: #d3f9d8; box-shadow: 0 0 0 4px var(--green); }

.match-game { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(255,248,232,0.94); }
.match-game h3 { margin: 0; font: bold 24px Georgia, serif; color: var(--navy); }
.match-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.print-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 rgba(29,47,69,0.3); font-size: 14px; }
.print-card canvas { width: 110px; height: 110px; }
.print-card.plate { background: #fff3bf; box-shadow: none; }
.print-card.plate canvas { width: 140px; height: 140px; }
button.print-card:hover { background: #f1f7ff; }
.equals { font: bold 40px Georgia, serif; }

/* ===== Case board and case summary ===== */
.case-board { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px; background: rgba(255,248,232,0.9); }
.case-board h3 { margin: 0; font: bold 26px Georgia, serif; color: var(--navy); }
.case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
.case-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 rgba(29,47,69,0.3); font-size: 15px; }
.case-card:hover { background: #f1f7ff; }
.case-card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(29,47,69,0.3); }
.case-card canvas { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); }
.case-card.solved { background: #ebfbee; }
.case-card small { color: #2f9e44; font-weight: bold; }
.big-surprise { font-size: 22px; font-weight: bold; padding: 10px 34px; border-radius: 26px; border: 4px solid var(--ink); background: var(--sun); box-shadow: 0 5px 0 rgba(29,47,69,0.4); }
.case-header { display: flex; align-items: center; gap: 10px; margin-top: 10px; font: bold 19px Georgia, serif; color: var(--navy); }
.case-header canvas { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 65%, #fff2c2, #ffd98a); flex: none; }
.steps-list { display: grid; gap: 5px; }
.step-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 5px 10px; border: 2px solid rgba(29,47,69,0.3); border-radius: 12px; background: #fff; }
.step-row.now { border-color: var(--ink); background: #fff3bf; font-weight: bold; }
.step-row.done { background: #ebfbee; opacity: 0.8; }
.step-row.later { opacity: 0.6; }
.step-icon { font-size: 20px; text-align: center; }
.step-row small { font-size: 12px; opacity: 0.8; }

.lobby-card { width: min(520px, 100%); padding: 18px 24px; text-align: center; position: relative; }
.lobby-card h2 { margin: 0 0 8px; font: bold 26px Georgia, serif; color: var(--navy); }
.code-big { font: bold 72px Georgia, serif; letter-spacing: 0.2em; margin: 4px 0 8px; color: var(--blue); }
.qr img { width: 210px; height: 210px; image-rendering: pixelated; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.qr small { display: block; font-size: 11px; opacity: 0.7; word-break: break-all; }
.lobby-status { font-weight: bold; }
#lobbyClose { position: absolute; top: 10px; right: 10px; }

@media (max-width: 900px) {
  .st-main { grid-template-columns: 1fr; overflow: auto; }
  .st-view { min-height: 340px; }
}
@media (max-height: 520px) {
  .arrow { width: 74px; height: 74px; }
  .arrow svg { width: 46px; height: 46px; }
  .drive-btn { width: 62px; height: 62px; font-size: 28px; }
  .siren { width: 74px; height: 74px; }
  .siren .lights i { width: 22px; height: 26px; }
  .side-buttons { gap: 6px; }
  .dialogue { top: 6px; width: min(640px, calc(100% - 200px)); }
  .dialogue canvas { width: 46px; height: 46px; }
  .gps-bubble { top: 70px; }
  .mission-card { width: 72px; height: 72px; }
  .mission-card canvas { width: 62px; height: 62px; }
  .gps-bubble canvas { width: 52px; height: 52px; }
  .gps-bubble span { font-size: 42px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- ===== Title: choose a role ===== -->
  <div id="title" class="overlay title-screen">
    <div class="card title-card">
      <canvas id="titleArt" width="1000" height="420" aria-hidden="true"></canvas>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
      <div class="roles">
        <button id="roleOfficer" class="role officer-role">
          <canvas id="roleOfficerArt" width="96" height="96" aria-hidden="true"></canvas>
          <b data-i18n="officerRole"></b><small data-i18n="officerHint"></small>
        </button>
        <button id="roleStation" class="role station-role">
          <canvas id="roleStationArt" width="96" height="96" aria-hidden="true"></canvas>
          <b data-i18n="stationRole"></b><small data-i18n="stationHint"></small>
        </button>
      </div>
      <div class="title-row">
        <label class="check"><input type="checkbox" id="sameComputer"> <span data-i18n="sameComputer"></span></label>
        <button class="round lang" data-lang-toggle data-i18n-label="language"><b>FR</b></button>
        <button class="round" data-sound-toggle data-i18n-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8c1.5 1.2 1.5 6.8 0 8 M19 5c3 2.5 3 11.5 0 14"/><path class="cross" d="M16 9l5 6 M21 9l-5 6"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ===== Officer: type the station's code ===== -->
  <div id="join" class="overlay" hidden>
    <div class="card join-card">
      <h2 data-i18n="joinTitle"></h2>
      <div id="codeSlots" class="code-slots"><span></span><span></span><span></span><span></span></div>
      <div id="keypad" class="keypad"></div>
      <button id="joinBack" class="small-button" data-i18n="back"></button>
    </div>
  </div>
  <button id="tapStart" class="overlay tap-start" hidden><span>🚓 ▶</span></button>

  <!-- ===== Officer HUD ===== -->
  <div id="officerHud" hidden>
    <div class="hud-top">
      <div id="missionCard" class="mission-card" hidden><canvas id="cardIcon" width="120" height="120" aria-hidden="true"></canvas></div>
      <div id="gpsBubble" class="gps-bubble" hidden><canvas id="gpsPortrait" width="100" height="100" aria-hidden="true"></canvas><span id="gpsArrow"></span></div>
      <div class="tools">
        <span class="pill small"><span id="officerStatus"></span> · <b id="officerCode"></b></span>
        <button class="round" data-sound-toggle data-i18n-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8c1.5 1.2 1.5 6.8 0 8 M19 5c3 2.5 3 11.5 0 14"/><path class="cross" d="M16 9l5 6 M21 9l-5 6"/></svg></button>
      </div>
    </div>
    <div id="driveControls" class="drive-controls" hidden>
      <div class="side-buttons">
        <button id="btnSiren" class="drive-btn siren" aria-label="siren"><span class="lights"><i></i><i></i></span></button>
        <button id="btnHorn" class="drive-btn horn" aria-label="horn">📯</button>
        <button id="btnRadio" class="drive-btn radio" aria-label="radio">📻</button>
      </div>
      <div class="arrows">
        <button id="btnLeft" class="arrow" aria-label="left"><svg viewBox="0 0 24 24"><path d="M14 5l-7 7 7 7 M7 12h12"/></svg></button>
        <button id="btnStraight" class="arrow" aria-label="straight"><svg viewBox="0 0 24 24"><path d="M5 11l7-7 7 7 M12 4v16"/></svg></button>
        <button id="btnRight" class="arrow" aria-label="right"><svg viewBox="0 0 24 24"><path d="M10 5l7 7-7 7 M17 12H5"/></svg></button>
      </div>
      <button id="btnBack" class="drive-btn back" aria-label="u-turn"><svg viewBox="0 0 24 24"><path d="M8 20V9a4 4 0 0 1 8 0v4 M12 10l4 4 4-4"/></svg></button>
    </div>
    <div id="dialogue" class="dialogue" hidden>
      <canvas id="portrait" width="150" height="150" aria-hidden="true"></canvas>
      <div class="dialogue-body"><strong id="speakerName"></strong><p id="speakerText"></p></div>
    </div>
    <div id="connOverlay" class="conn-overlay" hidden><div class="card"><div class="spinner"></div><p id="connText"></p></div></div>
    <div id="rotateHint" class="rotate-hint" hidden><span data-i18n="rotate"></span></div>
  </div>

  <!-- ===== Station (adult) ===== -->
  <div id="station" class="station" hidden>
    <header class="st-head">
      <div class="st-title"><canvas id="chiefFace" width="96" height="96" aria-hidden="true"></canvas><b data-i18n="stationTitle"></b></div>
      <span class="pill">🔑 <strong id="stationCode"></strong></span>
      <button id="stationStatus" class="pill status"></button>
      <span id="vehicleNote" class="vehicle-note"></span>
      <div class="st-tools">
        <button class="round lang" data-lang-toggle data-i18n-label="language"><b>FR</b></button>
        <button class="round" data-sound-toggle data-i18n-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8c1.5 1.2 1.5 6.8 0 8 M19 5c3 2.5 3 11.5 0 14"/><path class="cross" d="M16 9l5 6 M21 9l-5 6"/></svg></button>
      </div>
    </header>
    <main class="st-main">
      <section class="st-left">
        <div id="todo" class="todo" aria-live="polite"></div>
        <div class="st-view">
          <canvas id="stationCanvas"></canvas>
          <div id="matchGame" class="match-game" hidden></div>
          <div id="caseBoard" class="case-board" hidden></div>
          <div id="radioFlash" class="radio-flash" hidden data-i18n="radio"></div>
        </div>
        <div class="st-controls">
          <div id="gpsPad" class="pad" hidden>
            <span class="pad-title" data-i18n="gpsTitle"></span>
            <button data-dir="left" class="pad-btn">⬅</button>
            <button data-dir="straight" class="pad-btn">⬆</button>
            <button data-dir="right" class="pad-btn">➡</button>
            <button data-dir="back" class="pad-btn">↩</button>
          </div>
          <div id="lampPad" class="pad" hidden>
            <span class="pad-title" data-i18n="lampTitle"></span>
            <button data-dir="left" class="pad-btn">⬅</button>
            <button data-dir="up" class="pad-btn">⬆</button>
            <button data-dir="down" class="pad-btn">⬇</button>
            <button data-dir="right" class="pad-btn">➡</button>
          </div>
          <span id="nextTurn" class="next-turn" hidden></span>
          <button id="sendBtn" class="small-button glow" data-i18n="send" hidden></button>
          <button id="hintBtn" class="small-button glow" data-i18n="hint" hidden></button>
          <button id="repeatBtn" class="small-button glow" data-i18n="repeat" hidden></button>
          <button id="sayCellBtn" class="small-button glow" data-i18n="sayCell" hidden></button>
          <button id="askBtn" class="small-button glow" data-i18n="ask" hidden></button>
          <button id="newCaseBtn" class="small-button glow" data-i18n="newCase" hidden></button>
          <button id="bravoBtn" class="small-button bravo" data-i18n="bravoButton"></button>
        </div>
      </section>
      <aside class="st-side">
        <div id="caseSection">
          <div id="caseHeader" class="case-header"></div>
          <h3 data-i18n="steps"></h3>
          <div id="stepsList" class="steps-list"></div>
        </div>
        <div id="lineupBox">
          <h3 data-i18n="board"></h3>
          <div id="clues" class="clues"></div>
          <h3 data-i18n="witnesses"></h3>
          <div id="witnesses" class="witnesses"></div>
          <h3 data-i18n="suspects"></h3>
          <div id="suspects" class="suspects"></div>
          <p id="suspectNote" class="note"></p>
        </div>
      </aside>
    </main>
    <div id="lobby" class="overlay lobby">
      <div class="card lobby-card">
        <h2 data-i18n="stationTitle"></h2>
        <p data-i18n="lobbyHow"></p>
        <div id="lobbyCode" class="code-big"></div>
        <p id="lobbyScan" data-i18n="lobbyScan"></p>
        <div id="qr" class="qr"></div>
        <p id="lobbyLocal" class="note" data-i18n="lobbyLocal"></p>
        <p id="lobbyFile" class="note" data-i18n="lobbyFile"></p>
        <p id="lobbyStatus" class="lobby-status"></p>
        <button id="lobbyClose" class="small-button">✕</button>
      </div>
    </div>
  </div>

  qrcode.createStringToBytes = function(unicodeData, numChars) {

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {

              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

  <script>
'use strict';

// Every visible text and voice line lives in js/i18n/<code>.js. The officer follows the station's language.
const LANGUAGES = {
  fr: { name: 'FR', speech: 'fr-FR' },
  ru: { name: 'RU', speech: 'ru-RU' }
};
const STRINGS = {};
const LANG_STORAGE_KEY = 'teddyPatrol.lang';

function detectLanguage() {
  try {
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if (LANGUAGES[saved]) return saved;
  } catch (error) {
    // Storage can be blocked for local files
  }
  return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'fr';
}

let lang = detectLanguage();
const languageListeners = [];

// Current language table (nested objects like names, places, items)
const L = () => STRINGS[lang] || STRINGS.fr;

function t(key, ...args) {
  const value = L()[key] ?? STRINGS.fr[key];
  if (value === undefined) return key;
  return typeof value === 'function' ? value(...args) : value;
}

function applyStaticTexts() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-label]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.i18nLabel));
    el.title = t(el.dataset.i18nLabel);
  });
  document.querySelectorAll('.lang b').forEach(el => { el.textContent = LANGUAGES[lang].name; });
}

function setLanguage(code, remember) {
  if (!LANGUAGES[code] || code === lang) return;
  lang = code;
  if (remember !== false) { try { localStorage.setItem(LANG_STORAGE_KEY, code); } catch (error) { /* not remembered */ } }
  applyStaticTexts();
  languageListeners.forEach(fn => fn(code));
}

function nextLanguage() {
  const codes = Object.keys(LANGUAGES);
  return codes[(codes.indexOf(lang) + 1) % codes.length];
}

// Case engine. The state is plain JSON owned by the station (host): the officer sends events, the station applies

  const PRINTS = ['big', 'small', 'bird', 'hoof'];

  const GAMES = ['brush', 'lamp', 'letters', 'word', 'symbols', 'sketch', 'spot', 'safe', 'grid', 'lineup'];
  const NAME_GAMES = ['letters', 'word', 'symbols', 'sketch'];
  const WORD_GAMES = ['letters', 'word', 'symbols'];
  const QUESTIONS = { owl: ['who', 'where'], duck: ['what', 'more'] };
  // Hiding spots in the dark, as fractions of the scene
  const SPOTS = [[0.13, 0.66], [0.3, 0.84], [0.5, 0.62], [0.7, 0.85], [0.87, 0.64], [0.22, 0.44], [0.62, 0.42], [0.85, 0.4]];
  // Sketch artist: the suspects' faces
  const SKETCH = { fox: { color: 'orange', ears: 'pointy' }, mouse: { color: 'grey', ears: 'round' }, panda: { color: 'white', ears: 'round' }, rabbit: { color: 'beige', ears: 'long' } };
  const SKETCH_OPTIONS = { color: ['orange', 'grey', 'white', 'beige'], ears: ['pointy', 'round', 'long'], scarf: COLORS };
  const PROPS = ['cup', 'book', 'box', 'jar', 'flower', 'ball'];

  function random(seed) {

  }

    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }

// The child's device. The station owns the case state; this side shows scenes for it, runs the driving and the

const Officer = (function () {

  const STICKER_KEY = 'teddyPatrol.stickers';
  const STAGE_W = 1000, STAGE_H = 600;

  const O = {

  // ===== Voice queue: lines play one after another; `done` callbacks always run (even when interrupted) =====
  const queue = [];
  let current = null;
  function showBubble(item) {
    if (item.who === 'letter') { $('dialogue').hidden = true; return; }
    $('speakerName').textContent = L().names[item.who] || '';
    $('speakerText').textContent = item.text;
    $('dialogue').hidden = false;
    $('dialogue').classList.remove('pop'); void $('dialogue').offsetWidth; $('dialogue').classList.add('pop');
    drawPortrait($('portrait'), item.who);

  function next() {
    current = queue.shift() || null;
    if (!current) { $('dialogue').hidden = true; return; }
    const item = current;
    showBubble(item);
    say(item.text, item.who, () => {
      if (current !== item) return;
      setTimeout(() => { if (current === item) finishCurrent(); }, 450);
    });
  }
  function finishCurrent() {

// Driving in town. The camera turns with the vehicle so "left" on screen is always the driver's left.
(function () {

      if (target) {

    complete() {
      if (this.done) return;
      this.done = true;
      const word = this.pieces.join('');
      setTimeout(() => {
        sfx('fanfare');
        O.sequence([['teddy', this.pieces.join(', ') + '… ' + word + ' !'], ['chief', L().lettersNext]], () => O.game('complete'));
      }, 700);
    },
    effect(msg) { if (msg.kind === 'hint' && !this.done) O.pieceBoard.hint(this, L().letterHint); },
    down(p) {
      if (O.pieceBoard.tap(this, p) === 'ok' && this.next === this.pieces.length) this.complete();
    },
    update(dt) { O.pieceBoard.update(this, dt); },
    draw(c) { O.inStage(c => O.pieceBoard.draw(this, c, wordPicture)); }
  };

  // ===== Suspect lineup =====
  const SPOTS = [230, 500, 770];
  O.scenes.lineup = {
    enter() { this.shake = [0, 0, 0]; this.happy = -1; O.speak('chief', L().lineupIntro, { now: true }); },
    down(p) {
      if (this.happy >= 0) return;
      const i = SPOTS.findIndex(x => Math.abs(p.sx - x) < 110 && p.sy > 170 && p.sy < 560);
      if (i < 0) return;
      const s = O.state, sp = s.suspects[i];
      if (i === s.culprit) { this.happy = i; sfx('fanfare'); O.quiet(); O.game('pick', { i }); return; }
      this.shake[i] = 0.6; sfx('wrong');
      const why = C.alibi(s, i);
      O.speak(sp.species, why === 'paws' ? L().alibiPaws(C.pawOf(sp.species)) : L().alibiScarf(sp.scarf), { now: true });
      O.game('pick', { i });
    },
    update(dt) { this.shake = this.shake.map(v => Math.max(0, v - dt)); },
    draw(c) {
      O.inStage(c => {
        A.lineupRoom(c);
        O.state.suspects.forEach((sp, i) => {
          const x = SPOTS[i] + (this.shake[i] ? Math.sin(this.shake[i] * 40) * 6 : 0);
          c.save(); c.translate(x, 480); c.scale(1.75, 1.75);
          A.animal(c, sp.species, sp.scarf, O.clock, { happy: this.happy === i, wave: this.shake[i] > 0 });
          c.restore();
          A.rr(c, SPOTS[i] - 30, 500, 60, 50, 10, '#fff8e8', A.OUT, 3);
          c.fillStyle = A.OUT; c.font = 'bold 34px Georgia'; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(String(i + 1), SPOTS[i], 527);
        });
      });
    }
  };

  // ===== Happy ending and sticker =====
  // Who stands at the party: the caller, the one we found (or the culprit), and a prop
  function partyCast(s) {
    const d = C.def(s), cast = [d.caller];
    let extra = null;
    if (C.isLineup(s)) cast.push(C.culprit(s).species);
    else if (d.found !== d.caller) cast.push(d.found);
    if (s.caseId === 'balloon') extra = 'balloon';
    if (s.caseId === 'traffic') extra = 'light';
    return { cast, extra };
  }
  O.partyCast = partyCast;

  O.scenes.ending = {
    enter() {
      const s = O.state, text = O.caseText();
      this.sticker = -1; this.confetti = []; this.species = C.stickerOf(s);
      const lines = C.isLineup(s)
        ? [[C.culprit(s).species, text.confess[C.culprit(s).species]], text.forgive]
        : text.ending.slice();
      lines.push(['chief', L().endChief]);
      O.sequence(lines, () => {
        this.sticker = 0;
        sfx('sticker');
        O.addSticker(this.species);
        for (let i = 0; i < 80; i++) this.confetti.push({ x: Math.random() * 1000, y: -Math.random() * 400, v: 80 + Math.random() * 120, r: Math.random() * 6, c: ['#ff6f91', '#ffd23f', '#3f8cff', '#3fbf5a'][i % 4] });
        O.speak('teddy', L().yay, { done: () => setTimeout(() => O.send({ t: 'endDone' }), 1800) });
      });
    },
    update(dt) {
      if (this.sticker >= 0) this.sticker += dt;
      this.confetti.forEach(p => { p.y += p.v * dt; p.r += dt * 4; if (p.y > 620) p.y = -20; });
    },
    draw(c) {
      const s = O.state, happy = this.sticker >= 0;
      O.inStage(c => {
        A.party(c, O.clock);
        const { cast, extra } = partyCast(s);
        if (s.caseId === 'cake') { c.save(); c.translate(500, 398); c.scale(1.2, 1.2); A.cake(c, O.clock, true); c.restore(); }
        else if (extra) { c.save(); c.translate(500, extra === 'balloon' ? 300 + Math.sin(O.clock * 2) * 8 : 350); c.scale(1.6, 1.6); A.item(c, extra, happy); c.restore(); }
        const xs = cast.length > 1 ? [180, 360] : [270];
        cast.forEach((who, i) => O.drawWho(c, who, xs[i], 560, 1.5, { happy: true, wave: happy, chicks: true, crown: true, scarf: C.isLineup(s) && i === 1 ? C.culprit(s).scarf : undefined }));
        O.drawWho(c, 'teddy', 660, 560, 1.5, { happy: true, wave: happy });
        O.drawWho(c, 'chief', 840, 560, 1.5, { happy: true, wave: happy });
        this.confetti.forEach(p => { c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-6, -3, 12, 6); c.restore(); });
        if (this.sticker >= 0) {
          const k = Math.min(1, this.sticker / 0.6), size = 260 * (0.3 + 0.7 * k);
          c.save(); c.translate(500 - size / 2, 230 - size / 2 + Math.sin(O.clock * 3) * 6); c.rotate(Math.sin(O.clock * 2) * 0.05);
          A.sticker(c, this.species, O.clock, size, true); c.restore();
        }
      });
    }
  };

  // ===== Sticker book while the chief picks the next case =====
  O.scenes.done = {
    enter() { this.owned = O.stickers(); },
    draw(c) {
      O.inStage(c => {
        A.party(c, O.clock);
        O.banner(c, L().stickers, 96);
        C.STICKERS.forEach((who, i) => {
          c.save(); c.translate(105 + (i % 5) * 165, 170 + Math.floor(i / 5) * 160 + Math.sin(O.clock * 2 + i) * 3);
          A.sticker(c, who, O.clock, 140, this.owned.includes(who));
          c.restore();
        });
        O.banner(c, L().waitNewCase, 500);
      });
    }
  };
})();

  <script>
'use strict';

// New mini-games on the officer side (stage 1000 x 600): word, symbols, safe, spot, grid, sketch.
// In each one the child does the doing and the station holds the key; the station checks every event.
(function () {
  const O = Officer, A = Art, C = PatrolCase;
  const G = () => L().games;
  function text(c, str, x, y, size, color, align) {
    c.save(); c.fillStyle = color || A.OUT; c.font = `bold ${size}px Georgia`; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.fillText(str, x, y); c.restore();
  }
  function panel(c, x, y, w, h, fill) { A.rr(c, x, y + 6, w, h, 24, 'rgba(0,0,0,0.15)'); A.rr(c, x, y, w, h, 24, fill || '#fff8e8', A.OUT, 4); }
  const inBox = (p, x, y, w, h) => p.sx >= x && p.sx <= x + w && p.sy >= y && p.sy <= y + h;
  const shakeX = t => (t > 0 ? Math.sin(t * 40) * 7 : 0);

  // ===== Write a word: listen to the syllables and put them in order =====
  const EAR = { x: 900, y: 190, r: 46 };
  O.scenes.word = {
    enter() {
      O.pieceBoard.setup(this, C.pieces(O.state, C.current(O.state)));
      if (this.next < this.pieces.length) O.intro([['chief', G().word.intro]], () => this.sayWord());
      else this.complete();
    },
    // The word slowly, piece by piece, then whole
    sayWord() {
      const parts = this.pieces.length > 1 && this.pieces.some(p => p.length > 1) ? this.pieces : [];
      const slow = parts.map(p => p.toLowerCase()).join('… ');
      O.speak('letter', (slow ? slow + '… ' : '') + this.pieces.join('').toLowerCase(), { now: true });
    },
    complete() {
      if (this.done) return;
      this.done = true;
      setTimeout(() => { sfx('fanfare'); O.speak('teddy', G().word.done(this.pieces.join('')), { now: true, done: () => O.game('complete') }); }, 600);
    },
    effect(msg) {
      if (msg.kind === 'repeat') this.sayWord();
      if (msg.kind === 'hint' && !this.done) O.pieceBoard.hint(this, null);
    },
    down(p) {
      if (O.dist(p.sx, p.sy, EAR.x, EAR.y) < EAR.r) { sfx('click'); this.sayWord(); return; }
      if (O.pieceBoard.tap(this, p) === 'ok' && this.next === this.pieces.length) this.complete();
    },
    update(dt) { O.pieceBoard.update(this, dt); },
    draw(c) {
      O.inStage(c => {
        O.pieceBoard.draw(this, c, O.wordPicture);
        A.ell(c, EAR.x, EAR.y, EAR.r, EAR.r, '#d0ebff', A.OUT, 4);
        text(c, '🔊', EAR.x, EAR.y + 2, 44);
      });
    }
  };

  // ===== Secret message: one symbol per letter, the station has the codebook =====
  O.scenes.symbols = {
    enter() {
      const code = C.symbolCode(O.state, O.state.step);
      this.word = C.plain(O.state, O.stepData().word).split('');
      this.map = code.map; this.palette = code.palette;
      this.n = Math.min(O.progress().n || 0, this.word.length); this.done = false;
      this.shake = {}; this.wiggle = -1;
      const n = this.word.length;
      this.cell = Math.min(110, 860 / n);
      this.cellX = i => 500 - (n * this.cell) / 2 + this.cell * (i + 0.5);
      const perRow = Math.min(this.palette.length, 6);
      this.tiles = this.palette.map((ch, i) => {
        const row = Math.floor(i / perRow), inRow = Math.min(perRow, this.palette.length - row * perRow);
        return { ch, x: 500 + ((i % perRow) - (inRow - 1) / 2) * 112, y: 430 + row * 100 };
      });
      if (this.n < n) O.intro([['chief', G().symbols.intro]]);
      else this.complete();
    },
    complete() {
      if (this.done) return;
      this.done = true;
      const word = this.word.join('');
      setTimeout(() => { sfx('fanfare'); O.speak('teddy', G().symbols.done(word), { now: true, done: () => O.game('complete') }); }, 600);
    },
    effect(msg) {
      if (msg.kind !== 'hint' || this.done) return;
      const letter = this.word[this.n];
      this.wiggle = this.tiles.findIndex(t => t.ch === letter);
      this.wiggleUntil = O.clock + 2.5;
      O.speak('chief', G().symbols.hint(letter), { now: true });
    },
    down(p) {
      if (this.done) return;
      const i = this.tiles.findIndex(t => Math.abs(p.sx - t.x) < 48 && Math.abs(p.sy - t.y) < 44);
      if (i < 0) return;
      const tile = this.tiles[i];
      if (tile.ch === this.word[this.n]) {
        sfx('pop'); O.speak('letter', tile.ch.toLowerCase(), { now: true });
        O.game('piece', { i: this.n });
        this.n++;
        this.wiggle = -1;
        if (this.n === this.word.length) this.complete();
      } else {
        this.shake[i] = 0.5; sfx('wrong'); O.speak('letter', tile.ch.toLowerCase(), { now: true });
      }
    },
    update(dt) { Object.keys(this.shake).forEach(k => { this.shake[k] = Math.max(0, this.shake[k] - dt); }); },
    draw(c) {
      O.inStage(c => {
        A.room(c, O.place(), O.clock);
        panel(c, 40, 110, 920, 250, '#fdf3d7');
        const cw = this.cell;
        this.word.forEach((ch, i) => {
          const x = this.cellX(i), current = i === this.n && !this.done;
          A.rr(c, x - cw * 0.42, 130, cw * 0.84, 90, 12, current ? '#fff3bf' : '#fff', A.OUT, 3);
          c.save(); c.translate(x, 175); A.symbol(c, this.map[ch], Math.min(60, cw * 0.6)); c.restore();
          c.save(); c.setLineDash([8, 6]);
          A.rr(c, x - cw * 0.36, 240, cw * 0.72, 90, 12, i < this.n ? '#d3f9d8' : 'rgba(29,47,69,0.05)', A.OUT, 3);
          c.restore();
          if (i < this.n) text(c, ch, x, 288, Math.min(60, cw * 0.55));
          if (current) A.poly(c, [[x - 10, 340], [x + 10, 340], [x, 352]], '#ffd34d', A.OUT, 2);
        });
        this.tiles.forEach((t, i) => {
          const wig = i === this.wiggle && O.clock < this.wiggleUntil ? Math.sin(O.clock * 18) * 0.2 : 0;
          c.save(); c.translate(t.x + shakeX(this.shake[i] || 0), t.y); c.rotate(wig);
          A.rr(c, -42, -38, 84, 80, 14, 'rgba(0,0,0,0.15)');
          A.rr(c, -42, -42, 84, 80, 14, '#fff', A.OUT, 4);
          text(c, t.ch, 0, 0, 50);
          c.restore();
        });
      });
    }
  };

  // ===== Safe: each digit of the code is a small addition to count =====
  const KEYS = { x: 610, y: 330, size: 84, gap: 8 };
  function keyRect(v) {
    const i = v - 1, col = i % 3, row = Math.floor(i / 3);
    return { x: KEYS.x + col * (KEYS.size + KEYS.gap), y: KEYS.y + row * (KEYS.size + KEYS.gap) };
  }
  O.scenes.safe = {
    enter() {
      this.digits = O.stepData().digits;
      this.n = Math.min(O.progress().n || 0, this.digits.length);
      this.open = 0; this.done = false; this.flash = 0; this.wrong = 0; this.pressed = 0;
      if (this.n < this.digits.length) O.intro([['chief', G().safe.intro]]);
      else this.finish();
    },
    finish() {
      if (this.done) return;
      this.done = true;
      sfx('fanfare');
      O.speak('teddy', G().safe.open, { now: true, done: () => setTimeout(() => O.game('complete'), 600) });
    },
    effect(msg) {
      if (msg.kind !== 'hint' || this.done) return;
      const d = this.digits[this.n];
      O.speak('chief', G().safe.hint(d.a, d.b), { now: true });
    },
    down(p) {
      if (this.done) return;
      for (let v = 1; v <= 9; v++) {
        const r = keyRect(v);
        if (!inBox(p, r.x, r.y, KEYS.size, KEYS.size)) continue;
        this.pressed = v; this.pressedAt = O.clock;
        const d = this.digits[this.n];
        O.game('digit', { i: this.n, v });
        if (v === d.a + d.b) {
          sfx('click'); this.flash = 0.6;
          O.speak('teddy', G().safe.right(v), { now: true });
          this.n++;
          if (this.n === this.digits.length) setTimeout(() => this.finish(), 700);
        } else {
          sfx('wrong'); this.wrong = 0.5;
          O.speak('chief', G().safe.wrong, { now: true });
        }
        return;
      }
    },
    update(dt) {
      this.flash = Math.max(0, this.flash - dt); this.wrong = Math.max(0, this.wrong - dt);
      if (this.done) this.open = Math.min(1, this.open + dt * 1.5);
    },
    draw(c) {
      O.inStage(c => {
        A.room(c, O.place(), O.clock);
        // The safe with one window per digit
        c.save(); c.translate(250 + shakeX(this.wrong), 360); A.safe(c, this.open > 0.5, O.clock);
        if (this.open > 0.5) { c.save(); c.scale(1.3, 1.3); A.item(c, 'key', true); c.restore(); }
        else this.digits.forEach((d, i) => {
          const x = -90 + i * 70;
          A.rr(c, x - 28, -130, 56, 70, 10, i < this.n ? '#d3f9d8' : i === this.n ? '#fff3bf' : '#e9ecef', A.OUT, 3);
          text(c, i < this.n ? String(d.a + d.b) : '?', x, -94, 42);
        });
        c.restore();
        // The riddle for the current digit: a things + b things
        if (!this.done && this.n < this.digits.length) {
          const d = this.digits[this.n];
          panel(c, 470, 100, 500, 200, '#fff8e8');
          const group = (count, x0) => {
            for (let k = 0; k < count; k++) {
              c.save(); c.translate(x0 + (k % 3) * 46, 150 + Math.floor(k / 3) * 46); A.countIcon(c, d.icon, 40); c.restore();
            }
          };
          group(d.a, 510);
          text(c, '+', 680, 196, 56);
          group(d.b, 720);
          text(c, '= ?', 905, 196, 46);
          for (let v = 1; v <= 9; v++) {
            const r = keyRect(v), down = this.pressed === v && O.clock - this.pressedAt < 0.2;
            A.rr(c, r.x, r.y + (down ? 4 : 0), KEYS.size, KEYS.size, 16, down ? '#d0ebff' : '#fff', A.OUT, 4);
            text(c, String(v), r.x + KEYS.size / 2, r.y + KEYS.size / 2 - 8 + (down ? 4 : 0), 44);
            // Little dots under each number help to link the number and the quantity
            for (let k = 0; k < v; k++) A.ell(c, r.x + KEYS.size / 2 + (k - (v - 1) / 2) * 8, r.y + KEYS.size - 14, 2.6, 2.6, '#3f8cff');
          }
        }
      });
    }
  };

  // ===== Spot the difference: the station has the "before" photo =====
  const SLOT = i => ({ x: 200 + (i % 4) * 200, y: i < 4 ? 250 : 430 });
  function afterItems(data) {
    const items = data.items.map(it => Object.assign({}, it));
    data.changes.forEach(ch => {
      if (ch.type === 'missing') items[ch.i] = null;
      if (ch.type === 'color') items[ch.i].tint = ch.to;
      if (ch.type === 'swap') items[ch.i].kind = ch.to;
    });
    return items;
  }
  O.afterItems = afterItems;
  O.drawShelves = (c, items, found, scale) => {
    [300, 480].forEach(y => { A.rr(c, 80, y, 840, 18, 6, '#a8743f', A.OUT, 3); });
    items.forEach((it, i) => {
      const s = SLOT(i);
      if (it) { c.save(); c.translate(s.x, s.y); c.scale(scale || 1.6, scale || 1.6); A.prop(c, it.kind, it.tint); c.restore(); }
      if (found && found.includes(i)) A.ell(c, s.x, s.y, 66, 62, null, '#2f9e44', 6);
    });
  };
  O.scenes.spot = {
    enter() {
      this.data = O.stepData();
      this.items = afterItems(this.data);
      this.found = (O.progress().found || []).slice();
      this.done = false; this.cooldown = 0; this.miss = null;
      if (this.found.length < this.data.changes.length) O.intro([['chief', G().spot.intro]]);
      else this.finish();
    },
    finish() {
      if (this.done) return;
      this.done = true;
      sfx('fanfare');
      O.speak('chief', G().spot.done, { now: true, done: () => O.game('complete') });
    },
    down(p) {
      if (this.done) return;
      const i = [...Array(8).keys()].find(k => O.dist(p.sx, p.sy, SLOT(k).x, SLOT(k).y) < 80);
      if (i === undefined || this.found.includes(i)) return;
      if (this.data.changes.some(ch => ch.i === i)) {
        this.found.push(i);
        sfx('found');
        O.speak('teddy', G().spot.yes, { now: true });
        O.game('tap', { i });
        if (this.found.length === this.data.changes.length) setTimeout(() => this.finish(), 600);
      } else if (this.cooldown <= 0) {
        this.cooldown = 1; this.miss = { i, t: 0.5 };
        sfx('wrong');
        O.speak('teddy', G().spot.no, { now: true });
      }
    },
    update(dt) {
      this.cooldown -= dt;
      if (this.miss) { this.miss.t -= dt; if (this.miss.t <= 0) this.miss = null; }
    },
    draw(c) {
      O.inStage(c => {
        A.room(c, O.place(), O.clock);
        panel(c, 60, 140, 880, 420, 'rgba(255,248,232,0.92)');
        O.drawShelves(c, this.items, this.found);
        if (this.miss) { const s = SLOT(this.miss.i); A.ell(c, s.x, s.y, 60, 56, null, '#e03131', 5); }
        this.data.changes.forEach((ch, k) => A.ell(c, 420 + k * 80, 120, 22, 22, k < this.found.length ? '#40c057' : '#fff', A.OUT, 3));
      });
    }
  };

  // ===== Helicopter grid: find the cell the station names (letter + number) =====
  const MAP = { x: 300, y: 115, cell: 92 };
  O.scenes.grid = {
    enter() {
      this.data = O.stepData();
      const p = O.progress();
      this.found = !!p.found;
      this.at = { c: p.c >= 0 ? p.c : 2, r: p.r >= 0 ? p.r : 2 };
      this.hx = MAP.x + (this.at.c + 0.5) * MAP.cell; this.hy = MAP.y + (this.at.r + 0.5) * MAP.cell;
      this.flying = null; this.done = false; this.looked = new Set();
      if (this.found) this.finish();
      else O.intro([['chief', G().grid.intro]]);
    },
    letters() { return L().gridLetters.split(''); },
    finish() {
      if (this.done) return;
      this.done = true;
      sfx('fanfare');
      O.speak('teddy', G().grid.found, { now: true, done: () => O.game('complete') });
    },
    effect(msg) {
      if (msg.kind !== 'cellSay') return;
      const letter = this.letters()[this.data.c], number = this.data.r + 1;
      sfx('radio'); O.showGps(letter + number);
      O.speak('chief', G().grid.cell(letter, number), { now: true });
    },
    down(p) {
      if (this.done || this.flying) return;
      const c = Math.floor((p.sx - MAP.x) / MAP.cell), r = Math.floor((p.sy - MAP.y) / MAP.cell);
      if (c < 0 || r < 0 || c >= C.GRID || r >= C.GRID) return;
      sfx('whoosh');
      this.flying = { c, r };
    },
    land() {
      const { c, r } = this.flying;
      this.flying = null;
      this.at = { c, r };
      this.looked.add(c + ',' + r);
      O.game('cell', { c, r });
      if (c === this.data.c && r === this.data.r) { sfx('found'); this.found = true; setTimeout(() => this.finish(), 500); }
      else O.speak('teddy', G().grid.miss(this.letters()[c], r + 1), { now: true });
    },
    update(dt) {
      if (!this.flying) return;
      const tx = MAP.x + (this.flying.c + 0.5) * MAP.cell, ty = MAP.y + (this.flying.r + 0.5) * MAP.cell;
      const d = O.dist(this.hx, this.hy, tx, ty), step = dt * 420;
      if (d <= step) { this.hx = tx; this.hy = ty; this.land(); }

    },
    draw(c) {

        c.save(); c.translate(MAP.x, MAP.y); A.gridMap(c, MAP.cell, this.data, O.clock, this.found); c.restore();
        const L1 = this.letters();
        for (let i = 0; i < C.GRID; i++) {
          text(c, L1[i], MAP.x + (i + 0.5) * MAP.cell, MAP.y - 26, 38, i === this.at.c ? '#1971c2' : A.OUT);
          text(c, String(i + 1), MAP.x - 30, MAP.y + (i + 0.5) * MAP.cell, 38, i === this.at.r ? '#1971c2' : A.OUT);
        }
        this.looked.forEach(k => {
          const [cc, rr] = k.split(',').map(Number);
          if (cc === this.data.c && rr === this.data.r) return;
          A.ell(c, MAP.x + (cc + 0.85) * MAP.cell, MAP.y + (rr + 0.18) * MAP.cell, 9, 9, '#ced4da', A.OUT, 1.5);
        });
        A.rr(c, MAP.x + this.at.c * MAP.cell + 3, MAP.y + this.at.r * MAP.cell + 3, MAP.cell - 6, MAP.cell - 6, 10, null, '#1971c2', 4);

  // ===== Sketch artist: build the face the witness describes to the station =====
  const ROWS = [['color', 175], ['ears', 330], ['scarf', 480]];
  const optionX = i => 560 + i * 105;

    enter() {
      const p = O.progress();
      this.pick = { color: p.color, ears: p.ears, scarf: p.scarf };

      this.done = false; this.pop = 0;

    finish() {

      sfx('fanfare');
      O.speak('teddy', G().sketch.done, { now: true, done: () => O.game('complete') });
    },
    down(p) {
      if (this.done) return;
      ROWS.forEach(([cat, y]) => {
        C.SKETCH_OPTIONS[cat].forEach((v, i) => {
          if (O.dist(p.sx, p.sy, optionX(i), y) > 46) return;
          this.pick[cat] = v; this.pop = 0.3;
          sfx('pop');
          O.game('pick', { cat, v });
          if (this.matches()) setTimeout(() => this.finish(), 400);

    },
    update(dt) { this.pop = Math.max(0, this.pop - dt); },
    draw(c) {
      O.inStage(c => {
        A.room(c, O.place(), O.clock);
        panel(c, 60, 110, 420, 460, '#fffdf5');
        c.save(); c.translate(270, 360); c.scale(1.55 + this.pop * 0.3, 1.55 + this.pop * 0.3); A.sketchFace(c, this.pick, O.clock); c.restore();
        if (this.done) for (let i = 0; i < 5; i++) A.sparkle(c, 120 + i * 80, 140 + Math.sin(O.clock * 4 + i) * 8, 11, '#ffd34d');

        ROWS.forEach(([cat, y]) => {
          C.SKETCH_OPTIONS[cat].forEach((v, i) => {
            const x = optionX(i), on = this.pick[cat] === v;
            A.ell(c, x, y, 44, 44, on ? '#fff3bf' : '#fff', on ? '#1971c2' : A.OUT, on ? 6 : 3);
            if (cat === 'color') A.ell(c, x, y, 28, 28, A.FUR[v], A.OUT, 2.5);
            else if (cat === 'scarf') { A.rr(c, x - 28, y - 10, 56, 20, 10, A.SCARF[v], A.OUT, 2.5); A.rr(c, x + 8, y, 12, 24, 4, A.SCARF[v], A.OUT, 2); }

'use strict';

// The adult's computer: owns the case state, picks cases, guides the officer and holds the keys of the mini-games.
const Station = (function () {
  const $ = id => document.getElementById(id);
  const C = PatrolCase;
  const SAVE_KEY = 'teddyPatrol.station', SOLVED_KEY = 'teddyPatrol.solved';
  const OFFICER_EVENTS = ['callDone', 'vehicle', 'arrive', 'g', 'endDone'];
  const GAME_ICON = { brush: '🐾', lamp: '🔦', letters: '🔤', word: '✏️', symbols: '🗝️', sketch: '🧑‍🎨', spot: '🔍', safe: '🔢', grid: '🚁', lineup: '👮' };

  const S = { state: null, car: null, lamp: null, brush: 0, code: '', local: false, connected: false, crossed: [], radioUntil: 0 };
  let link = null;

  function save() {
    try { sessionStorage.setItem(SAVE_KEY, JSON.stringify({ code: S.code, local: S.local, state: S.state })); } catch (error) { /* not kept */ }
  }
  S.restore = () => { try { return JSON.parse(sessionStorage.getItem(SAVE_KEY)); } catch (error) { return null; } };
  const solved = () => { try { return JSON.parse(localStorage.getItem(SOLVED_KEY)) || []; } catch (error) { return []; } };

  function broadcast() {
    if (link) link.send({ t: 'state', s: S.state });
    save();
    render();
  }
  function act(e) {
    const before = { phase: S.state.phase, step: S.state.step, tries: S.state.progress && S.state.progress.tries };
    if (!C.apply(S.state, e)) return false;
    const s = S.state;
    if (e.t === 'g' && e.a === 'match') {
      if (s.step === before.step) { sfx('wrong'); shakeMatch(e.print); } else sfx('found');
    }
    if (before.step !== s.step || before.phase !== s.phase) sfx('connect');
    if (s.phase === 'done' && before.phase !== 'done') {
      const list = solved();
      if (!list.includes(s.caseId)) { list.push(s.caseId); try { localStorage.setItem(SOLVED_KEY, JSON.stringify(list)); } catch (error) { /* not kept */ } }
    }
    broadcast();
    return true;
  }
  function fx(kind, extra) { if (link) link.send(Object.assign({ t: 'fx', kind }, extra || {})); }
  // Station-side game actions (fingerprint file, sending the item to find)
  const gameAct = (a, extra) => act(Object.assign({ t: 'g', step: S.state.step, a }, extra || {}));
  S.act = act; S.fx = fx; S.gameAct = gameAct;

  function startCase(id, seed) {
    const ids = Object.keys(C.CASES);
    if (!C.CASES[id]) {
      // Surprise: prefer cases not solved yet
      const fresh = ids.filter(k => !solved().includes(k) && k !== (S.state && S.state.caseId));
      const pool = fresh.length ? fresh : ids.filter(k => k !== (S.state && S.state.caseId));
      id = pool[Math.floor(Math.random() * pool.length)];
    }
    S.state = C.create(id, seed || 0, lang);
    S.crossed = []; S.car = null; S.lamp = null; S.brush = 0;
    sfx('radio');
    broadcast();
  }
  S.startCase = startCase;

  function onMessage(msg) {
    switch (msg.t) {
      case 'hello': link.send({ t: 'state', s: S.state }); break;
      case 'car': S.car = msg; break;
      case 'lamp': S.lamp = msg; break;
      case 'brush': S.brush = msg.p; break;
      case 'radio': sfx('radio'); S.radioUntil = performance.now() + 4000; $('radioFlash').hidden = false; setTimeout(() => { if (performance.now() >= S.radioUntil) $('radioFlash').hidden = true; }, 4100); break;
      default: if (OFFICER_EVENTS.includes(msg.t)) act(msg);
    }
  }

  function statusText() {
    const s = S.lastStatus;
    if (!s) return '';
    const text = L().status[s] || s;
    return s === 'connected' && S.route ? text + ' · ' + (L().route[S.route] || S.route) : text;
  }

  function onStatus(status, route) {
    const wasConnected = S.connected;
    S.connected = status === 'connected';
    S.lastStatus = status;
    S.route = route;
    $('stationStatus').textContent = statusText();
    $('stationStatus').className = 'pill status ' + status;
    $('lobbyStatus').textContent = statusText();
    if (S.connected && !wasConnected) { sfx('connect'); $('lobby').hidden = true; }
  }

  // ===== What the adult should do now =====
  function todoText(s) {
    const T = L();
    if (s.phase === 'board' || s.phase === 'done') return T.todo.board;
    if (s.phase === 'drive') return T.todo.goTo(C.need(s));
    if (s.phase !== 'game') return T.todo[s.phase] || '';
    const g = C.game(s), p = s.progress;
    if (g === 'brush') return p.part === 'match' ? T.todo.match : T.todo.brush;
    if (g === 'lamp') return p.sent ? T.todo.lamp : T.todo.lampSend;
    if (g === 'letters') return C.isLineup(s) ? T.todo.letters : T.todo.lettersWord;
    return T.todo[g] || '';
  }

  function canvasIcon(cv, draw) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    c.save(); c.translate(cv.width / 2, cv.height / 2); draw(c); c.restore();
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  S.el = el; S.canvasIcon = canvasIcon;

  // ===== Case board =====
  function renderBoard() {
    const s = S.state, box = $('caseBoard'), T = L();
    box.hidden = !['board', 'done'].includes(s.phase);
    if (box.hidden) return;
    const key = lang + '|' + solved().join(',');
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.textContent = '';
    box.append(el('h3', '', T.boardTitle));
    const grid = el('div', 'case-grid');
    const done = solved();
    Object.keys(C.CASES).forEach(id => {
      const card = el('button', 'case-card' + (done.includes(id) ? ' solved' : ''));
      card.dataset.case = id;
      const cv = el('canvas'); cv.width = cv.height = 96;
      Art.portrait(cv.getContext('2d'), C.CASES[id].caller, 0, 96);
      card.append(cv, el('b', '', T.cases[id].title));
      if (done.includes(id)) card.append(el('small', '', '✔ ' + T.solved));
      card.addEventListener('click', () => startCase(id));
      grid.append(card);
    });
    box.append(grid);
    const surprise = el('button', 'big-surprise', T.surprise);
    surprise.addEventListener('click', () => startCase(null));
    box.append(surprise);
  }

  // ===== Case summary: caller, steps =====
  function renderCase() {
    const s = S.state, T = L(), head = $('caseHeader'), list = $('stepsList');
    head.textContent = ''; list.textContent = '';
    $('caseSection').hidden = s.phase === 'board';
    if (s.phase === 'board') return;
    const d = C.def(s);
    const cv = el('canvas'); cv.width = cv.height = 72;
    Art.portrait(cv.getContext('2d'), d.caller, 0, 72);
    head.append(cv, el('b', '', T.cases[s.caseId].title));
    s.steps.forEach((st, i) => {
      const state = i < s.step || s.phase === 'ending' || s.phase === 'done' ? 'done' : i === s.step ? 'now' : 'later';
      const row = el('div', 'step-row ' + state);
      row.append(el('span', 'step-icon', state === 'done' ? '✔' : GAME_ICON[st.game]), el('b', '', T.gameNames[st.game]), el('small', '', T.places[st.place]));
      list.append(row);
    });
  }

  // ===== Lineup cases: clues, witnesses, suspects =====
  function renderClues() {
    const s = S.state, T = L(), box = $('clues');
    box.textContent = '';
    const row = (key, known, value, icon) => {
      const r = el('div', 'clue' + (known ? ' known' : ''));
      const cv = el('canvas'); cv.width = cv.height = 64;
      if (known && icon) canvasIcon(cv, icon);
      r.append(cv);
      const body = el('div', 'clue-body');
      body.append(el('small', '', T.clue[key]), el('b', '', known ? value : T.unknown));
      r.append(body);
      box.append(r);
    };
    const paw = C.paw(s), culprit = C.culprit(s);
    row('print', !!s.results.print, T.paws[paw], c => { c.scale(0.55, 0.55); Art.pawPrint(c, paw); });
    row('scarf', !!s.results.scarf, T.colors[culprit.scarf], c => { Art.rr(c, -24, -10, 48, 20, 10, Art.SCARF[culprit.scarf], Art.OUT, 2.5); });
    row('name', !!s.results.name, T.names[culprit.species], c => { c.translate(-32, -36); Art.portrait(c, culprit.species, 0, 64); });
  }

  function answerText(k) {
    const s = S.state, fn = L().answers[k];
    if (k === 'owl.who') return fn(C.culprit(s).scarf);
    if (k === 'owl.where') { const next = s.steps.slice(s.step + 1).find(st => st.place !== C.current(s).place); return fn((next || s.steps[s.steps.length - 1]).place); }
    if (k === 'duck.what') return fn(C.paw(s));
    return fn();
  }

  function renderWitnesses() {
    const s = S.state, T = L(), box = $('witnesses');
    box.textContent = '';
    const open = C.canInterview(s);
    Object.entries(C.QUESTIONS).forEach(([who, qs]) => {
      const card = el('div', 'witness');
      const head = el('div', 'witness-head');
      const cv = el('canvas'); cv.width = cv.height = 72;
      Art.portrait(cv.getContext('2d'), who, 0, 72);
      head.append(cv, el('b', '', T.names[who]));
      card.append(head);
      const buttons = el('div', 'questions');
      qs.forEach(q => {
        const k = who + '.' + q, asked = s.asked.includes(k);
        const b = el('button', 'small-button' + (asked ? ' done' : open ? ' glow' : ''), T.questions[k]);
        b.disabled = asked || !open;
        b.addEventListener('click', () => {
          const answer = answerText(k);
          if (!act({ t: 'ask', witness: who, q })) return;
          say(answer, who);
        });
        buttons.append(b);
      });
      card.append(buttons);
      qs.forEach(q => { const k = who + '.' + q; if (s.asked.includes(k)) card.append(el('p', 'answer', '« ' + answerText(k) + ' »')); });
      box.append(card);
    });
    if (!open) box.append(el('p', 'note', T.witnessLater));
  }

  function renderSuspects() {
    const s = S.state, T = L(), box = $('suspects');
    box.textContent = '';
    const known = s.results.print && s.results.scarf && (C.game(s) === 'lineup' || ['ending', 'done'].includes(s.phase));
    s.suspects.forEach((sp, i) => {
      const card = el('button', 'suspect' + (S.crossed.includes(i) || s.wrong.includes(i) ? ' crossed' : '') + (known && i === s.culprit ? ' answer' : ''));
      const cv = el('canvas'); cv.width = 110; cv.height = 150;
      const c = cv.getContext('2d');
      c.save(); c.translate(55, 146); c.scale(0.78, 0.78); Art.animal(c, sp.species, sp.scarf, 0); c.restore();
      card.append(cv, el('b', '', (i + 1) + '. ' + T.names[sp.species]));
      card.addEventListener('click', () => {
        S.crossed = S.crossed.includes(i) ? S.crossed.filter(v => v !== i) : S.crossed.concat(i);
        renderSuspects();
      });
      box.append(card);
    });
    $('suspectNote').textContent = known ? T.answerIs(s.culprit + 1) : T.suspectsHint;
  }

  // ===== Fingerprint file (adult part of the brush game) =====
  function renderMatch() {
    const s = S.state, T = L(), box = $('matchGame');
    const st = C.current(s);
    box.hidden = !(C.game(s) === 'brush' && s.progress.part === 'match');
    if (box.hidden) return;
    const key = s.seed + '|' + s.step + '|' + lang;
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.textContent = '';
    box.append(el('h3', '', T.matchTitle));
    const wrap = el('div', 'match-row');
    const plate = el('div', 'print-card plate');
    const pc = el('canvas'); pc.width = pc.height = 160;
    canvasIcon(pc, c => { Art.plate(c, 74); c.rotate(-0.25); c.scale(0.8, 0.8); Art.pawPrint(c, st.data.print); });
    plate.append(pc, el('b', '', T.plate));
    wrap.append(plate, el('div', 'equals', '='));
    st.data.choices.forEach(kind => {
      const b = el('button', 'print-card');
      b.dataset.print = kind;
      const cv = el('canvas'); cv.width = cv.height = 130;
      canvasIcon(cv, c => { c.scale(1.2, 1.2); Art.pawPrint(c, kind); });
      b.append(cv, el('b', '', T.paws[kind]));
      b.addEventListener('click', () => gameAct('match', { print: kind }));
      wrap.append(b);
    });
    box.append(wrap);
  }
  function shakeMatch(kind) {
    const b = document.querySelector(`#matchGame [data-print="${kind}"]`);
    if (!b) return;
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }

  function renderControls() {
    const s = S.state, T = L(), g = C.game(s);
    $('todo').textContent = todoText(s);
    $('gpsPad').hidden = s.phase !== 'drive';
    $('lampPad').hidden = g !== 'lamp';
    $('sendBtn').hidden = !(g === 'lamp' && !s.progress.sent);
    $('hintBtn').hidden = !['letters', 'word', 'symbols', 'safe'].includes(g);
    $('repeatBtn').hidden = g !== 'word';
    $('sayCellBtn').hidden = g !== 'grid';
    $('askBtn').hidden = g !== 'lineup';
    $('newCaseBtn').hidden = !['ending', 'done'].includes(s.phase);
    $('vehicleNote').textContent = s.vehicle ? T.vehicleIs(T.vehicles[s.vehicle]) : '';
    $('lineupBox').hidden = !(s.suspects && C.isLineup(s));
  }

  function render() {
    if (!S.state) return;
    renderControls();
    renderBoard();
    renderCase();
    if (S.state.suspects && C.isLineup(S.state)) { renderClues(); renderWitnesses(); renderSuspects(); }
    renderMatch();
  }

  // Next instruction shown under the view (refreshed every frame by the view)
  S.nextHint = () => {
    const s = S.state, T = L(), g = C.game(s);
    if (['letters', 'word', 'symbols'].includes(g)) {
      const pieces = C.pieces(s, C.current(s)), next = pieces[s.progress.n];
      return next ? (next.length > 1 ? T.nextPiece(next) : T.nextLetter(next)) : '';
    }
    if (g === 'safe') {
      const d = C.current(s).data.digits[s.progress.n];
      return d ? `${d.a} + ${d.b} = ${d.a + d.b}` : '';
    }
    if (g === 'grid') { const d = C.current(s).data; return T.target + ' : ' + T.gridLetters[d.c] + ' ' + (d.r + 1); }
    if (s.phase !== 'drive' || !S.car) return '';
    const place = s.target || C.need(s);
    if (!place) return '';
    const turn = Town.nextTurn(S.car, place);
    return turn ? T.nextTurn + ' : ' + T.turnNames[turn] : '';
  };

  function lobby() {
    $('lobbyCode').textContent = S.code;
    $('stationCode').textContent = S.code;
    $('lobbyLocal').hidden = !S.local;
    const online = /^https?:$/.test(location.protocol);
    $('qr').textContent = '';
    $('lobbyScan').hidden = !online || S.local;
    $('lobbyFile').hidden = online || S.local;
    if (online && !S.local && typeof qrcode !== 'undefined') {
      const url = location.origin + location.pathname + '#join=' + S.code;
      const qr = qrcode(0, 'M');
      qr.addData(url); qr.make();
      const img = new Image();
      img.src = qr.createDataURL(6, 8);
      img.alt = url;
      $('qr').append(img, el('small', '', url));
    }
  }

  function wire() {
    document.querySelectorAll('#gpsPad [data-dir]').forEach(b => b.addEventListener('click', () => { sfx('gps'); fx('gps', { dir: b.dataset.dir }); }));
    document.querySelectorAll('#lampPad [data-dir]').forEach(b => b.addEventListener('click', () => { sfx('gps'); fx('lampDir', { dir: b.dataset.dir }); }));
    $('bravoBtn').addEventListener('click', () => { sfx('sparkle'); fx('bravo'); });
    $('hintBtn').addEventListener('click', () => fx('hint'));
    $('repeatBtn').addEventListener('click', () => fx('repeat'));
    $('sayCellBtn').addEventListener('click', () => { sfx('radio'); fx('cellSay'); });
    $('sendBtn').addEventListener('click', () => { sfx('radio'); gameAct('send'); });
    $('askBtn').addEventListener('click', () => { sfx('radio'); fx('ask'); });
    $('newCaseBtn').addEventListener('click', () => { S.state = C.board(lang); broadcast(); });
    $('stationStatus').addEventListener('click', () => { $('lobby').hidden = false; });
    $('lobbyClose').addEventListener('click', () => { $('lobby').hidden = true; });
    languageListeners.push(code => {
      if (S.state && C.apply(S.state, { t: 'lang', lang: code })) broadcast(); else render();
      lobby();
      if (S.lastStatus) { $('stationStatus').textContent = statusText(); $('lobbyStatus').textContent = statusText(); }
    });
  }

  function start(netFactory, code, local, saved) {
    S.code = code; S.local = local;
    S.state = saved && saved.state && saved.state.v === 2 ? saved.state : C.board(lang);
    if (S.state.lang !== lang) C.apply(S.state, { t: 'lang', lang });
    if (S.state.phase === 'board') S.state.lang = lang;
    document.body.classList.add('station');
    $('station').hidden = false;
    wire();
    lobby();
    render();
    save();
    link = netFactory({ onMessage, onStatus }).link;
    StationView.start(S);
  }

  S.start = start;
  return S;
})();
