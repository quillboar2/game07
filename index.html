'use strict';

// Live picture on the adult's screen: the whole town map while driving, or the adult's side of each mini-game
// (the key the child does not see: codebook, answers, "before" photo, grid target, witness description).
const StationView = (function () {
  const $ = id => document.getElementById(id);
  const A = Art, T = Town, C = PatrolCase;
  let S = null, canvas, ctx, width = 0, height = 0, ratio = 1, clock = 0, last = 0, townImage = null, hint = '';
  let map = { k: 1, ox: 0, oy: 0 };
  const shown = { x: 0, y: 0, a: 0, ready: false };

  function resize() {
    const box = canvas.parentElement.getBoundingClientRect();
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(200, box.width); height = Math.max(200, box.height);
    canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    const k = Math.min(width / T.WIDTH, height / T.HEIGHT);
    map = { k, ox: (width - T.WIDTH * k) / 2, oy: (height - T.HEIGHT * k) / 2 };
  }

  function inStage(fn) {
    const k = Math.min(width / 1000, height / 600);
    ctx.save(); ctx.translate((width - 1000 * k) / 2, (height - 600 * k) / 2); ctx.scale(k, k); fn(ctx); ctx.restore();
  }

  function label(c, text, x, y, size, bg) {
    c.save();
    c.font = `bold ${size || 22}px "Trebuchet MS", sans-serif`;
    const w = c.measureText(text).width + 20;
    A.rr(c, x - w / 2, y - (size || 22) * 0.75, w, (size || 22) * 1.5, 10, bg || 'rgba(255,248,232,0.95)', A.OUT, 2);
    c.fillStyle = A.OUT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + 1);
    c.restore();
  }
  function text(c, str, x, y, size, color, align) {
    c.save(); c.fillStyle = color || A.OUT; c.font = `bold ${size}px Georgia`; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.fillText(str, x, y); c.restore();
  }
  function panel(c, x, y, w, h, fill) { A.rr(c, x, y, w, h, 20, fill || '#fff8e8', A.OUT, 3); }
  const step = () => C.current(S.state);
  const data = () => step().data;
  const prog = () => S.state.progress || {};

  // ===== Town map =====
  function drawMap() {
    const s = S.state;
    ctx.fillStyle = '#9ed27a'; ctx.fillRect(0, 0, width, height);
    ctx.save(); ctx.translate(map.ox, map.oy); ctx.scale(map.k, map.k);
    ctx.drawImage(townImage, 0, 0, T.WIDTH, T.HEIGHT);
    const need = C.need(s), place = s.target || need;
    if (need && need !== s.target) {
      const P = T.PLACES[need];
      ctx.save(); ctx.setLineDash([14, 10]); A.ell(ctx, P.x, P.y, 95, 95, 'rgba(255,211,77,0.18)', '#e8a400', 6); ctx.restore();
    }
    if (S.car) {
      const car = S.car, pos = T.position(car.from, car.to, car.s, T.LANE);
      if (!shown.ready) { shown.x = pos.x; shown.y = pos.y; shown.a = pos.angle; shown.ready = true; }
      shown.x += (pos.x - shown.x) * 0.25; shown.y += (pos.y - shown.y) * 0.25;
      let d = pos.angle - shown.a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; shown.a += d * 0.25;
      if (place) {
        const r = T.route(car.from, car.to, place);
        if (r) {
          const P = T.PLACES[place];
          const pts = [[shown.x, shown.y]];
          if (r.uturn) pts.push([T.nodes[car.from].x, T.nodes[car.from].y]);
          r.path.slice(1, -1).forEach(n => pts.push([T.nodes[n].x, T.nodes[n].y]));
          pts.push([P.roadX, P.roadY]);
          ctx.save(); ctx.setLineDash([18, 14]); ctx.lineDashOffset = -clock * 40;
          A.line(ctx, pts, 'rgba(255,255,255,0.9)', 14); A.line(ctx, pts, '#3f8cff', 8);
          ctx.restore();
        }
      }
      A.ell(ctx, shown.x, shown.y, 50 + Math.sin(clock * 5) * 6, 50 + Math.sin(clock * 5) * 6, 'rgba(63,140,255,0.2)', '#3f8cff', 4);
      ctx.save(); ctx.translate(shown.x, shown.y); ctx.rotate(shown.a); ctx.scale(1.3, 1.3);
      A.topVehicle(ctx, s.vehicle || 'car', clock, car.siren); ctx.restore();
      if (car.w) label(ctx, '⏸', shown.x, shown.y - 70, 26);
    }
    Object.keys(T.PLACES).forEach(name => {
      const P = T.PLACES[name];
      ctx.save(); ctx.translate(P.x, P.y); ctx.scale(1.2, 1.2); A.placeBadge(ctx, name, clock, name === s.target); ctx.restore();
      label(ctx, L().places[name], P.x, P.y + 58, 24, name === s.target ? '#ffe680' : null);
    });
    ctx.restore();
    if (!s.target && s.phase === 'drive') label(ctx, L().mapHint, width / 2, 30, 18);
  }

  function placeAt(x, y) {
    const wx = (x - map.ox) / map.k, wy = (y - map.oy) / map.k;
    let best = null, bestD = 110;
    Object.entries(T.PLACES).forEach(([name, P]) => {
      const d = Math.min(Math.hypot(wx - P.x, wy - P.y), Math.hypot(wx - P.roadX, wy - P.roadY) + 20);
      if (d < bestD) { bestD = d; best = name; }
    });
    return best;
  }

  // ===== Phases before and after the mini-games =====
  function drawCall() {
    inStage(c => {
      A.office(c, clock);
      c.save(); c.translate(360, 368); c.scale(1.2, 1.2); A.phone(c, clock, S.state.phase === 'call'); c.restore();
      c.save(); c.translate(640, 520); c.scale(1.7, 1.7); A.teddy(c, clock, { wave: true }); c.restore();
      if (S.state.caseId) { c.save(); c.translate(860, 300); c.scale(1.2, 1.2); A.character(c, C.def(S.state).caller, clock, {}); c.restore(); }
    });
  }
  function drawGarage() {
    inStage(c => {
      A.garage(c, clock);
      [['car', 360, 1.2], ['moto', 620, 1.3], ['horse', 840, 1.05]].forEach(([k, x, sc]) => {
        c.save(); c.translate(x, 545); c.scale(sc, sc); A.sideVehicle(c, k, clock, {}); c.restore();
      });
    });
  }
  function drawBoard() {
    inStage(c => {
      A.party(c, clock);
      const ids = Object.keys(C.CASES);
      ids.forEach((id, i) => { c.save(); c.translate(90 + i * 118, 560); c.scale(0.85, 0.85); A.character(c, C.CASES[id].caller, clock, { crown: true }); c.restore(); });
    });
  }
  function drawEnding() {
    const s = S.state;
    inStage(c => {
      A.party(c, clock);
      const { cast, extra } = Officer.partyCast(s);
      if (s.caseId === 'cake') { c.save(); c.translate(500, 398); c.scale(1.2, 1.2); A.cake(c, clock, true); c.restore(); }
      else if (extra) { c.save(); c.translate(500, 330); c.scale(1.6, 1.6); A.item(c, extra, true); c.restore(); }
      const xs = cast.length > 1 ? [180, 360] : [270];
      cast.forEach((who, i) => { c.save(); c.translate(xs[i], 560); c.scale(1.5, 1.5); A.character(c, who, clock, { happy: true, chicks: true, crown: true, scarf: C.isLineup(s) && i === 1 ? C.culprit(s).scarf : undefined }); c.restore(); });
      c.save(); c.translate(660, 560); c.scale(1.5, 1.5); A.teddy(c, clock, { happy: true, wave: true }); c.restore();
      c.save(); c.translate(840, 560); c.scale(1.5, 1.5); A.chief(c, clock, { happy: true }); c.restore();
      if (s.phase === 'done') { c.save(); c.translate(390, 120); A.sticker(c, C.stickerOf(s), clock, 220, true); c.restore(); }
    });
  }

  // ===== Mini-games, adult side =====
  const VIEWS = {
    brush() {
      const s = S.state;
      inStage(c => {
        A.room(c, step().place, clock);
        c.save(); c.translate(150, 560); c.scale(1.5, 1.5); A.character(c, C.def(s).caller, clock, {}); c.restore();
        c.save(); c.translate(500, 355); A.plate(c, 165);
        c.save(); c.rotate(-0.25); c.scale(1.35, 1.35); A.pawPrint(c, data().print); c.restore();
        const left = prog().part === 'match' ? 0 : 1 - S.brush;
        c.globalAlpha = Math.min(0.96, left * 1.2); A.ell(c, 0, 0, 157, 157, 'rgb(160,150,140)'); c.globalAlpha = 1;
        c.restore();
        if (prog().part === 'brush') {
          A.rr(c, 300, 540, 400, 30, 15, '#fff', A.OUT, 3);
          A.rr(c, 300, 540, 400 * Math.min(1, S.brush / 0.72), 30, 15, '#4cc552', A.OUT, 3);
          label(c, L().brushProgress, 500, 515, 20);
        }
      });
    },
    lamp() {
      const d = data(), target = d.objects.find(o => o.kind === d.item);
      inStage(c => {
        A.room(c, step().place, clock);
        c.save(); c.globalAlpha = 0.45; c.fillStyle = '#fff3c4'; c.fillRect(-500, -300, 2000, 1200); c.restore();
        d.objects.forEach(o => {
          c.save(); c.translate(o.x * 1000, o.y * 600); c.scale(1.25, 1.25);
          A.item(c, o.kind, o === target && prog().sent, clock);
          c.restore();
        });
        A.ell(c, target.x * 1000, target.y * 600, 70, 70, null, '#ffd34d', 5);
        if (S.lamp) {
          const x = S.lamp.x * 1000, y = S.lamp.y * 600;
          A.ell(c, x, y, 150, 150, 'rgba(255,243,160,0.25)', '#ffb703', 5);
          A.ell(c, x, y, 8, 8, '#ffb703');
        }
        panel(c, 20, 20, 230, 150);
        text(c, L().target, 135, 45, 22);
        c.save(); c.translate(135, 110); A.item(c, d.item, false, clock); c.restore();
      });
    },
    pieces() {
      const s = S.state, pieces = C.pieces(s, step()), n = pieces.length, done = prog().n || 0;
      inStage(c => {
        A.gardenNight(c, clock);
        c.save(); c.globalAlpha = 0.5; c.fillStyle = '#fff3c4'; c.fillRect(-500, -300, 2000, 1200); c.restore();
        A.rr(c, 40, 90, 920, 480, 30, '#fff8e8', A.OUT, 4);
        const w = Math.min(pieces.some(p => p.length > 1) ? 200 : 120, 860 / n);
        pieces.forEach((ch, i) => {
          const x = 500 - (n * w) / 2 + w * (i + 0.5), isDone = i < done, nextOne = i === done;
          A.rr(c, x - w * 0.42, 260 - 46, w * 0.84, 92, 12, isDone ? '#d3f9d8' : nextOne ? '#ffe680' : '#fff', A.OUT, 4);
          text(c, ch, x, 264, Math.min(56, w * (ch.length > 2 ? 0.3 : 0.5)), isDone ? A.OUT : 'rgba(29,47,69,0.4)');
        });
        c.save(); c.translate(500, 450); c.scale(0.9, 0.9);
        if (C.isLineup(s)) { c.translate(-50, -55); A.portrait(c, C.culprit(s).species, clock, 100); } else A.wordIcon(c, data().word, clock);
        c.restore();
      });
    },
    symbols() {
      const s = S.state, word = C.plain(s, data().word).split(''), code = C.symbolCode(s, s.step), done = prog().n || 0;
      inStage(c => {
        A.room(c, step().place, clock);
        panel(c, 30, 20, 940, 250);
        text(c, L().codebook, 500, 48, 28, '#22427a');
        const entries = Object.keys(code.map).sort();
        const per = Math.ceil(entries.length / 2), cw = 900 / per;
        entries.forEach((ch, i) => {
          const x = 50 + (i % per) * cw + cw / 2, y = 110 + Math.floor(i / per) * 85;
          const needed = ch === word[done];
          A.rr(c, x - cw / 2 + 6, y - 32, cw - 12, 72, 12, needed ? '#ffe680' : '#fff', A.OUT, 2);
          c.save(); c.translate(x - 22, y + 4); A.symbol(c, code.map[ch], 40); c.restore();
          text(c, '= ' + ch, x + 22, y + 4, 30);
        });
        panel(c, 30, 300, 940, 260);
        const n = word.length, w = Math.min(110, 880 / n);
        word.forEach((ch, i) => {
          const x = 500 - (n * w) / 2 + w * (i + 0.5);
          A.rr(c, x - w * 0.42, 330, w * 0.84, 90, 12, i === done ? '#fff3bf' : '#fff', A.OUT, 3);
          c.save(); c.translate(x, 375); A.symbol(c, code.map[ch], Math.min(56, w * 0.55)); c.restore();
          A.rr(c, x - w * 0.36, 440, w * 0.72, 90, 12, i < done ? '#d3f9d8' : '#f1f3f5', A.OUT, 3);
          text(c, ch, x, 487, Math.min(54, w * 0.5), i < done ? A.OUT : 'rgba(29,47,69,0.35)');
        });
      });
    },
    safe() {
      const digits = data().digits, done = prog().n || 0;
      inStage(c => {
        A.room(c, step().place, clock);
        panel(c, 60, 40, 880, 520);
        text(c, L().code + ' : ' + digits.map(d => d.a + d.b).join(' '), 500, 95, 46, '#22427a');
        digits.forEach((d, i) => {
          const y = 190 + i * 125, now = i === done;
          A.rr(c, 100, y - 50, 800, 104, 18, i < done ? '#d3f9d8' : now ? '#fff3bf' : '#fff', A.OUT, 3);
          for (let k = 0; k < d.a; k++) { c.save(); c.translate(150 + (k % 5) * 38, y - 18 + Math.floor(k / 5) * 38); A.countIcon(c, d.icon, 32); c.restore(); }
          text(c, '+', 360, y, 44);
          for (let k = 0; k < d.b; k++) { c.save(); c.translate(410 + (k % 5) * 38, y - 18 + Math.floor(k / 5) * 38); A.countIcon(c, d.icon, 32); c.restore(); }
          text(c, `${d.a} + ${d.b} = ${d.a + d.b}`, 780, y, 40, i < done ? '#2f9e44' : A.OUT);
        });
        if (prog().wrong) label(c, '✗ ' + prog().wrong, 880, 540, 20);
      });
    },
    spot() {
      const d = data(), found = prog().found || [];
      inStage(c => {
        A.room(c, step().place, clock);
        // Left: before (with the differences circled), right: now as the child sees it
        [[0, d.items, L().before, true], [500, Officer.afterItems(d), L().now, false]].forEach(([x0, items, title, before]) => {
          c.save(); c.translate(x0 + 15, 60); c.scale(0.47, 0.47);
          A.rr(c, 40, 120, 920, 470, 30, before ? '#fffbe6' : '#f8f9fa', A.OUT, 6);
          Officer.drawShelves(c, items, null, 1.6);
          d.changes.forEach(ch => {
            const s = { x: 200 + (ch.i % 4) * 200, y: ch.i < 4 ? 250 : 430 };
            const ok = found.includes(ch.i);
            A.ell(c, s.x, s.y, 74, 70, null, ok ? '#2f9e44' : '#f59f00', 9);
          });
          c.restore();
          label(c, title, x0 + 250, 95, 26);
        });
        label(c, found.length + ' / ' + d.changes.length, 500, 520, 30);
      });
    },
    grid() {
      const d = data(), p = prog(), size = 92, x0 = 300, y0 = 105;
      inStage(c => {
        A.room(c, 'park', clock);
        c.save(); c.globalAlpha = 0.35; c.fillStyle = '#fff'; c.fillRect(-500, -300, 2000, 1200); c.restore();
        c.save(); c.translate(x0, y0); A.gridMap(c, size, d, clock, true); c.restore();
        const letters = L().gridLetters;
        for (let i = 0; i < C.GRID; i++) {
          text(c, letters[i], x0 + (i + 0.5) * size, y0 - 24, 34, i === d.c ? '#e8590c' : A.OUT);
          text(c, String(i + 1), x0 - 28, y0 + (i + 0.5) * size, 34, i === d.r ? '#e8590c' : A.OUT);
        }
        A.rr(c, x0 + d.c * size + 3, y0 + d.r * size + 3, size - 6, size - 6, 10, null, '#e8590c', 6);
        if (p.c >= 0) { c.save(); c.translate(x0 + (p.c + 0.5) * size, y0 + (p.r + 0.5) * size); A.helicopter(c, clock, 56); c.restore(); }
        panel(c, 790, 180, 190, 150);
        text(c, L().target, 885, 215, 22);
        text(c, letters[d.c] + ' ' + (d.r + 1), 885, 275, 64, '#e8590c');
      });
    },
    sketch() {
      const d = data(), p = prog(), T1 = L();
      inStage(c => {
        A.room(c, step().place, clock);
        panel(c, 30, 30, 940, 200);
        c.save(); c.translate(60, 60); A.portrait(c, 'owl', clock, 130); c.restore();
        text(c, T1.witnessSays, 210, 70, 24, '#22427a', 'left');
        c.save(); c.font = 'bold 26px "Trebuchet MS"'; c.fillStyle = A.OUT;
        const words = T1.sketchSays(d.color, d.ears, d.scarf).split(' ');
        let line = '', y = 120;
        words.forEach(w => { if (c.measureText(line + w).width > 720) { c.fillText(line, 210, y); line = ''; y += 34; } line += w + ' '; });
        c.fillText(line, 210, y);
        c.restore();
        [['color', 0], ['ears', 1], ['scarf', 2]].forEach(([cat, i]) => {
          const x = 180 + i * 320, ok = p[cat] === d[cat];
          panel(c, x - 140, 260, 280, 290, ok ? '#e6fcf5' : '#fff');
          c.save(); c.translate(x, 420); c.scale(0.9, 0.9);
          A.sketchFace(c, cat === 'color' ? { color: p.color } : cat === 'ears' ? { ears: p.ears, color: 'beige' } : { scarf: p.scarf, color: 'beige' }, clock);
          c.restore();
          text(c, ok ? '✔' : p[cat] ? '✗' : '…', x + 110, 290, 34, ok ? '#2f9e44' : '#e03131');
        });
        // The real face, small, for the adult
        c.save(); c.translate(900, 470); c.scale(0.45, 0.45); A.sketchFace(c, d, clock); c.restore();
      });
    },
    lineup() {
      const s = S.state;
      inStage(c => {
        A.lineupRoom(c);
        s.suspects.forEach((sp, i) => {
          const x = [230, 500, 770][i];
          c.save(); c.translate(x, 480); c.scale(1.75, 1.75);
          A.animal(c, sp.species, sp.scarf, clock, {});
          c.restore();
          A.rr(c, x - 30, 500, 60, 50, 10, s.wrong.includes(i) ? '#ffc9c9' : '#fff8e8', A.OUT, 3);
          text(c, String(i + 1), x, 527, 34);
        });
        label(c, L().question(C.paw(s), C.culprit(s).scarf), 500, 130, 24);
      });
    }
  };
  VIEWS.letters = VIEWS.pieces;
  VIEWS.word = VIEWS.pieces;

  function frame(time) {
    const dt = Math.min(0.05, (time - last) / 1000 || 0);
    last = time; clock += dt;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const s = S.state, phase = s.phase;
    if (phase === 'drive') drawMap();
    else if (phase === 'call') drawCall();
    else if (phase === 'garage') drawGarage();
    else if (phase === 'game') VIEWS[C.game(s)]();
    else if (phase === 'board') drawBoard();
    else drawEnding();
    const h = S.nextHint();
    if (h !== hint) { hint = h; $('nextTurn').textContent = h; $('nextTurn').hidden = !h; }
    const face = $('chiefFace');
    if (face) { const c = face.getContext('2d'); c.clearRect(0, 0, face.width, face.height); A.portrait(c, 'chief', clock, face.width); }
    requestAnimationFrame(frame);
  }

  function start(station) {
    S = station;
    canvas = $('stationCanvas');
    ctx = canvas.getContext('2d');
    townImage = document.createElement('canvas');
    townImage.width = T.WIDTH; townImage.height = T.HEIGHT;
    A.drawTown(townImage.getContext('2d'));
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);
    canvas.addEventListener('pointerdown', e => {
      audioStart();
      if (S.state.phase !== 'drive') return;
      const r = canvas.getBoundingClientRect();
      const place = placeAt(e.clientX - r.left, e.clientY - r.top);
      if (place) { sfx('click'); S.act({ t: 'target', place }); }
    });
    canvas.addEventListener('pointermove', e => {
      if (S.state.phase !== 'drive') { canvas.style.cursor = ''; return; }
      const r = canvas.getBoundingClientRect();
      canvas.style.cursor = placeAt(e.clientX - r.left, e.clientY - r.top) ? 'pointer' : '';
    });
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  return { start };
})();

</script>
  <script>
'use strict';

// Title screen, role choice and pairing. URL shortcuts: #join=1234 (officer, from the QR code),
// #station, #officer, and &local=1 (two tabs of one browser, no internet needed).
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.hash.slice(1));
  let code = '';

  function drawTitle() {
    const cv = $('titleArt'), c = cv.getContext('2d');
    const time = performance.now() / 1000;
    c.clearRect(0, 0, cv.width, cv.height);
    c.save(); c.scale(cv.width / 1000, cv.height / 420); c.translate(0, -150);
    Art.garage(c, time);
    c.save(); c.translate(600, 540); c.scale(1.25, 1.25); Art.sideVehicle(c, 'car', time, { siren: true }); c.restore();
    c.save(); c.translate(300, 545); c.scale(1.6, 1.6); Art.teddy(c, time, { wave: true }); c.restore();
    c.save(); c.translate(860, 545); c.scale(1.5, 1.5); Art.chief(c, time, { point: false }); c.restore();
    c.restore();
    ['roleOfficerArt', 'roleStationArt'].forEach((id, i) => {
      const p = $(id).getContext('2d');
      p.clearRect(0, 0, 96, 96);
      Art.portrait(p, i ? 'chief' : 'teddy', time, 96);
    });
    if (!$('title').hidden) requestAnimationFrame(drawTitle);
  }

  function langButtons() {
    document.querySelectorAll('[data-lang-toggle]').forEach(b => b.addEventListener('click', () => { audioStart(); setLanguage(nextLanguage()); }));
    document.querySelectorAll('[data-sound-toggle]').forEach(b => {
      b.classList.toggle('muted', sound.muted);
      b.addEventListener('click', () => {
        audioStart(); setMuted(!sound.muted);
        document.querySelectorAll('[data-sound-toggle]').forEach(x => x.classList.toggle('muted', sound.muted));
      });
    });
  }

  const useLocal = () => $('sameComputer').checked;

  function openLink(role, theCode, local) {
    return handlers => Net.open(role, theCode, local, handlers);
  }

  function startStation() {
    audioStart();
    const local = useLocal();
    const saved = Station.restore();
    const wanted = params.get('code');
    const usable = saved && saved.code && saved.local === local && (!wanted || saved.code === wanted) ? saved : null;
    const stationCode = (usable && usable.code) || wanted || Net.makeCode();
    $('title').hidden = true;
    Station.start(openLink('station', stationCode, local), stationCode, local, usable);
  }

  // ===== Officer: type the 4-digit code =====
  function showJoin() {
    audioStart();
    $('title').hidden = true;
    $('join').hidden = false;
    renderCode();
  }
  function renderCode() {
    document.querySelectorAll('#codeSlots span').forEach((s, i) => { s.textContent = code[i] || ''; s.classList.toggle('filled', !!code[i]); });
  }
  function typeDigit(d) {
    if (code.length >= 4) return;
    code += d; sfx('click'); renderCode();
    if (code.length === 4) setTimeout(joinNow, 250);
  }
  function joinNow() {
    $('join').hidden = true;
    Officer.start(openLink('officer', code, useLocal()), code);
  }
  function keypad() {
    const pad = $('keypad');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0'].forEach(k => {
      const b = document.createElement('button');
      b.className = 'key' + (k === '⌫' ? ' erase' : '');
      b.textContent = k;
      b.addEventListener('click', () => {
        if (k === '⌫') { code = code.slice(0, -1); sfx('click'); renderCode(); } else typeDigit(k);
      });
      pad.append(b);
    });
    document.addEventListener('keydown', e => {
      if ($('join').hidden) return;
      if (/^[0-9]$/.test(e.key)) typeDigit(e.key);
      if (e.key === 'Backspace') { code = code.slice(0, -1); renderCode(); }
    });
    $('joinBack').addEventListener('click', () => { code = ''; $('join').hidden = true; $('title').hidden = false; requestAnimationFrame(drawTitle); });
  }

  function init() {
    applyStaticTexts();
    langButtons();
    keypad();
    if (params.get('local') === '1') $('sameComputer').checked = true;
    $('roleOfficer').addEventListener('click', showJoin);
    $('roleStation').addEventListener('click', startStation);
    const join = params.get('join');
    if (join && /^\d{4}$/.test(join)) {
      // Opened from the QR code: one tap to start (browsers need a tap before sound and speech)
      code = join;
      $('title').hidden = true;
      $('tapStart').hidden = false;
      $('tapStart').addEventListener('click', () => { audioStart(); $('tapStart').hidden = true; joinNow(); }, { once: true });
      return;
    }
    if (params.has('station')) { $('title').hidden = true; startStation(); return; }
    if (params.has('officer')) { showJoin(); return; }
    requestAnimationFrame(drawTitle);
  }

  init();
})();

</script>
</body>
</html>
